<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completed Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">
        <img src="https://ui-avatars.com/api/?name=Ansh+Mishra&background=2c3e50&color=fff&size=150" alt="Ansh Mishra" class="profile-image">
        
        <div class="profile-info">
            <h2>Ansh Mishra</h2>
            <p class="profile-title">AI & Frontend Developer</p>
            <p class="profile-bio">Passionate about building intelligent web applications and exploring data structures. Currently pursuing BCA in Artificial Intelligence.</p>
            
            <!-- Added a call-to-action button for the finalized component -->
            <a href="#" class="follow-btn">Follow Profile</a>
        </div>

        <div class="profile-stats">
            <div class="stat-box">
                <span class="stat-number">12</span>
                <span class="stat-label">Projects</span>
            </div>
            <div class="stat-box">
                <span class="stat-number">3.8</span>
                <span class="stat-label">GPA</span>
            </div>
            <div class="stat-box">
                <span class="stat-number">2028</span>
                <span class="stat-label">Batch</span>
            </div>
        </div>
    </div>

</body>
</html>
