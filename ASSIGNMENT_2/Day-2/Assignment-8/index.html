<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="store-section">
        <div class="store-header">
            <h2>Featured Equipment</h2>
            <p>Upgrade your setup with our premium developer gear.</p>
        </div>

        <!-- The Flexbox Grid Container -->
        <div class="product-layout">
            
            <!-- Product Card 1 -->
            <div class="product-card">
                <div class="img-placeholder">
                    <span>Laptop Image</span>
                </div>
                <div class="product-details">
                    <span class="product-category">Hardware</span>
                    <h3>DevPro Laptop 16"</h3>
                    <p class="price">$1,499.00</p>
                    <button class="cart-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Product Card 2 -->
            <div class="product-card">
                <div class="img-placeholder">
                    <span>Monitor Image</span>
                </div>
                <div class="product-details">
                    <span class="product-category">Display</span>
                    <h3>Ultrawide 34" Monitor</h3>
                    <p class="price">$599.00</p>
                    <button class="cart-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Product Card 3 -->
            <div class="product-card">
                <div class="img-placeholder">
                    <span>Keyboard Image</span>
                </div>
                <div class="product-details">
                    <span class="product-category">Accessories</span>
                    <h3>Mechanical Keyboard</h3>
                    <p class="price">$129.00</p>
                    <button class="cart-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Product Card 4 -->
            <div class="product-card">
                <div class="img-placeholder">
                    <span>Mouse Image</span>
                </div>
                <div class="product-details">
                    <span class="product-category">Accessories</span>
                    <h3>Ergonomic Mouse</h3>
                    <p class="price">$89.00</p>
                    <button class="cart-btn">Add to Cart</button>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
