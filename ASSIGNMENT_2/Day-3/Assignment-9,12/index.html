<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- The Macro Grid Container -->
    <div class="dashboard-container">
        
        <!-- Sidebar Area -->
        <aside class="sidebar">
            <div class="brand">AppAdmin</div>
            <ul class="nav-list">
                <li><a href="#" class="active">Overview</a></li>
                <li><a href="#">Analytics</a></li>
                <li><a href="#">Users</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </aside>

        <!-- Header Area -->
        <header class="top-header">
            <h2>Dashboard Overview</h2>
            <div class="user-profile">
                <span>Ansh Mishra</span>
                <div class="avatar">AM</div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="content-area">
            
            <!-- The Micro Grid (Widgets) -->
            <div class="widget-grid">
                <div class="widget">
                    <h3>Total Users</h3>
                    <p class="data">1,248</p>
                </div>
                <div class="widget">
                    <h3>Revenue</h3>
                    <p class="data">$12,450</p>
                </div>
                <div class="widget">
                    <h3>Active Sessions</h3>
                    <p class="data">342</p>
                </div>
                <div class="widget">
                    <h3>Bounce Rate</h3>
                    <p class="data">42.3%</p>
                </div>
            </div>

            <div class="chart-widget">
                <h3>Monthly Growth Analytics</h3>
                <!-- Real Chart Image using Inline SVG -->
                <svg viewBox="0 0 800 300" width="100%" height="100%" style="background: #ffffff; border-radius: 8px; margin-top: 15px;">
                    <!-- Grid Lines -->
                    <line x1="0" y1="50" x2="800" y2="50" stroke="#f1f5f9" stroke-width="2" />
                    <line x1="0" y1="125" x2="800" y2="125" stroke="#f1f5f9" stroke-width="2" />
                    <line x1="0" y1="200" x2="800" y2="200" stroke="#f1f5f9" stroke-width="2" />
                    <!-- Area Fill -->
                    <polygon fill="#dbeafe" points="0,250 100,180 250,210 400,120 550,160 700,60 800,90 800,300 0,300" opacity="0.6" />
                    <!-- Line Chart -->
                    <polyline fill="none" stroke="#3b82f6" stroke-width="4" points="0,250 100,180 250,210 400,120 550,160 700,60 800,90" />
                    <!-- Data Points -->
                    <circle cx="100" cy="180" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="3" />
                    <circle cx="250" cy="210" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="3" />
                    <circle cx="400" cy="120" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="3" />
                    <circle cx="550" cy="160" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="3" />
                    <circle cx="700" cy="60" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="3" />
                </svg>
            </div>

        </main>
    </div>

</body>
</html>
