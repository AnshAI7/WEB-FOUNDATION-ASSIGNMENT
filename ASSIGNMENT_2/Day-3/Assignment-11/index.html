<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Product Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="store-layout">
        <header class="store-header">
            <h2>New Arrivals</h2>
            <p>Discover our latest collection of premium tech accessories.</p>
        </header>

        <div class="ecommerce-grid">
            
            <article class="product-item">
                <div class="product-image-container">
                    <!-- Bulletproof Image Placeholder -->
                    <svg viewBox="0 0 400 300" class="product-img" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="#e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#475569">Laptop Image</text></svg>
                </div>
                <div class="product-info">
                    <span class="category">Hardware</span>
                    <h3>Pro Developer Laptop</h3>
                    <p class="price">$1,299.00</p>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            </article>

            <article class="product-item">
                <div class="product-image-container">
                    <svg viewBox="0 0 400 300" class="product-img" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="#e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#475569">Smartphone Image</text></svg>
                </div>
                <div class="product-info">
                    <span class="category">Mobile</span>
                    <h3>X-Series Smartphone</h3>
                    <p class="price">$899.00</p>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            </article>

            <article class="product-item">
                <div class="product-image-container">
                    <svg viewBox="0 0 400 300" class="product-img" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="#e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#475569">Camera Lens Image</text></svg>
                </div>
                <div class="product-info">
                    <span class="category">Photography</span>
                    <h3>Professional 50mm Prime Lens for Mirrorless Cameras</h3>
                    <p class="price">$450.00</p>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            </article>

            <article class="product-item">
                <div class="product-image-container">
                    <svg viewBox="0 0 400 300" class="product-img" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="#e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#475569">Desk Mat Image</text></svg>
                </div>
                <div class="product-info">
                    <span class="category">Workspace</span>
                    <h3>Aluminium Desk Mat</h3>
                    <p class="price">$45.00</p>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            </article>

        </div>
    </section>
</body>
</html>
