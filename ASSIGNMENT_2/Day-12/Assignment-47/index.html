<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Helper Module</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="module-wrapper">
        <header>
            <h2>StorageHelper Engine</h2>
            <p>Automatically serializing Objects and Arrays into JSON.</p>
        </header>

        <div class="controls">
            <button id="btn-save" class="btn btn-primary">Save Complex Object</button>
            <button id="btn-load" class="btn btn-secondary">Load & Parse Data</button>
            <button id="btn-clear" class="btn btn-danger">Clear Storage</button>
        </div>

        <section class="terminal">
            <div class="terminal-header">Data Retrieved from localStorage:</div>
            <pre id="output-screen">// Waiting for action...</pre>
        </section>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
