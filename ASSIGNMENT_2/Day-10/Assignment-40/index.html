<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Card Rendering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="portfolio-container">
        <header>
            <h2>My Developer Portfolio</h2>
            <p>Cards generated dynamically via JavaScript Data Arrays.</p>
        </header>

        <!-- Notice how this container is completely empty! -->
        <!-- JavaScript will inject the HTML directly inside here. -->
        <section id="portfolio-grid" class="grid-layout">
            <!-- JS Injection Zone -->
        </section>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
